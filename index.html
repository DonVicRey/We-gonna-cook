<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Tabernacle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

    
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            background: radial-gradient(circle at center, #1a1b35 0%, #050508 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

      
        .header {
            text-align: center;
            padding: 40px 20px 0;
            z-index: 10;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #a0a0b5;
            font-weight: 300;
        }

        
        #canvas-container {
            flex-grow: 1;
            width: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: -20px;
        }

        
        .info-panel {
            text-align: center;
            padding: 20px;
            z-index: 10;
            margin-bottom: 80px;
        }

        .info-panel p {
            font-size: 0.95rem;
            color: #b3b3c6;
            margin-bottom: 5px;
        }

        .info-panel .highlight {
            color: #ffffff;
            font-weight: 600;
        }

        
        .bottom-nav {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 20;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #8e8e9f;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .nav-btn:hover { color: #ffffff; }

        .mic-btn-container {
            position: relative;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mic-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: #ffffff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.4);
        }

       
        .wave {
            position: absolute;
            width: 150px;
            height: 40px;
            background: linear-gradient(90deg, transparent, rgba(138, 43, 226, 0.6), rgba(0, 212, 255, 0.6), transparent);
            border-radius: 50%;
            z-index: 1;
            filter: blur(8px);
            animation: pulseWave 2s infinite ease-in-out;
        }

        @keyframes pulseWave {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <img src="https://ui-avatars.com/api/?name=Michael&background=random" alt="User Avatar" class="avatar">
            <h1>Hi, User</h1>
            <p class="subtitle">I can help</p>
        </header>

        <div id="canvas-container"></div>

        <div class="info-panel">
            <p>T A B E R N A C L E</p>
            <p>First Ui design<span class="highlight">May-25-2026</span></p>
        </div>

        <nav class="bottom-nav">
            <button class="nav-btn"><i class="fa-solid fa-house"></i></button>
            
            <div class="mic-btn-container">
                <div class="wave"></div>
                <div class="mic-btn">
                    <i class="fa-solid fa-microphone"></i>
                </div>
            </div>
            
            <button class="nav-btn"><i class="fa-solid fa-sliders"></i></button>
        </nav>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        
    
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 3500; // Adjust for density
        const posArray = new Float32Array(particlesCount * 3);

        
        for(let i = 0; i < particlesCount * 3; i += 3) {
            const radius = 1.8;
            const theta = 2 * Math.PI * Math.random();
            const phi = Math.acos(2 * Math.random() - 1);
            
            
            const noise = (Math.random() - 0.5) * 0.4;
            const r = radius + noise;

            posArray[i] = r * Math.sin(phi) * Math.cos(theta);     // x
            posArray[i+1] = r * Math.sin(phi) * Math.sin(theta);   // y
            posArray[i+2] = r * Math.cos(phi);                     // z
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

        
        const material = new THREE.PointsMaterial({
            size: 0.015,
            color: 0xa8b8ff, // Bright purplish blue
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending // Crucial for the glowing energy effect
        });

        const particlesMesh = new THREE.Points(particlesGeometry, material);
        scene.add(particlesMesh);

        
        const coreGeometry = new THREE.SphereGeometry(1.5, 32, 32);
        const coreMaterial = new THREE.MeshBasicMaterial({
            color: 0x4B0082,
            transparent: true,
            opacity: 0.15,
            blending: THREE.AdditiveBlending
        });
        const coreMesh = new THREE.Mesh(coreGeometry, coreMaterial);
        scene.add(coreMesh);

        camera.position.z = 4.5;

        
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            
            particlesMesh.rotation.y += 0.002;
            particlesMesh.rotation.x = Math.sin(elapsedTime * 0.2) * 0.2; // Slight wobble
            
            
            const scale = 1 + Math.sin(elapsedTime * 2) * 0.05;
            coreMesh.scale.set(scale, scale, scale);

            renderer.render(scene, camera);
        }

        animate();

        
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>p
