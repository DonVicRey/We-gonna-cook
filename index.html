<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Core Interface</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            perspective: 1200px;
        }

        .scene {
            width: 80vw;
            height: 80vw;
            max-width: 400px;
            max-height: 400px;
            position: relative;
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotateY(0deg); }
            50% { transform: translateY(-15px) rotateY(5deg); }
        }

        .core-container {
            position: absolute;
            transform-style: preserve-3d;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .controls {
    position: absolute;
    bottom: 40px;
    width: 100%;
    display: flex;
    justify-content: center;
    z-index: 100;
}

button {
    background: rgba(0, 242, 255, 0.05);
    border: 1px solid #00f2ff;
    color: #00f2ff;
    padding: 12px 24px;
    font-family: monospace;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(0, 242, 255, 0.2), inset 0 0 10px rgba(0, 242, 255, 0.1);
    text-transform: uppercase;
    letter-spacing: 2px;
    border-radius: 4px;
    transition: all 0.3s ease;
    backdrop-filter: blur(4px);
}

button:hover {
    background: rgba(0, 242, 255, 0.15);
    box-shadow: 0 0 25px rgba(0, 242, 255, 0.5), inset 0 0 15px rgba(0, 242, 255, 0.2);
    transform: translateY(-2px);
}

button:active {
    transform: translateY(1px);
}
        
        .ring {
            position: absolute;
            border: 1.5px solid rgba(0, 217, 255, 0.3);
            border-radius: 50%;
            transform-style: preserve-3d;
        }

        .eye-socket {
            position: absolute;
            width: 30%;
            height: 30%;
            border: 3px solid #00f2ff;
            border-radius: 50%;
            box-shadow: 0 0 20px #00f2ff, inset 0 0 15px #00f2ff;
            background: radial-gradient(circle, rgba(0,242,255,0.15) 0%, transparent 75%);
            animation: pulse 2.5s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .pupil {
            position: absolute;
            width: 35%;
            height: 35%;
            background: #fff;
            border-radius: 50%;
            top: 32.5%;
            left: 32.5%;
            box-shadow: 0 0 25px #fff, 0 0 50px #00f2ff;
        }

        .data-stream {
            position: absolute;
            width: 1px;
            height: 40px;
            background: linear-gradient(to bottom, transparent, #00f2ff, transparent);
            opacity: 0.4;
        }

        .hologram-plate {
            position: absolute;
            width: 150%;
            height: 150%;
            border: 1px solid rgba(0, 242, 255, 0.1);
            transform: rotateX(85deg) translateZ(-50px);
            background: repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(0, 242, 255, 0.03) 2px);
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="hologram-plate"></div>
        <div class="core-container" id="core">
            <div class="eye-socket">
                <div class="pupil" id="pupil"></div>
            </div>
        </div>
    </div>

    <div class="controls">
<button id="speakBtn" onclick="speak('System fully operational. Vocal synchronization algorithms online. Ready for execution.')">Start communication</button>
    </div>
    
    <script>
        const core = document.getElementById('core');
        const pupil = document.getElementById('pupil');
        const scene = document.querySelector('.scene');

        const ringCount = window.innerWidth < 600 ? 5 : 8;

        const ringsArray = [];

for (let i = 0; i < ringCount; i++) {
    const ring = document.createElement('div');
    ring.className = 'ring';
    const size = 150 + i * (window.innerWidth < 600 ? 25 : 35);
    ring.style.width = `${size}px`;
    ring.style.height = `${size}px`;
    
    const baseTransform = `rotateX(${i * 22}deg) rotateY(${i * 12}deg)`;
    ring.dataset.baseTransform = baseTransform;
    ring.style.transform = baseTransform;
    
    core.appendChild(ring);
    ringsArray.push({
        element: ring,
        baseTransform: baseTransform,
        phase: i * 0.5
    });
}

        const moveEvent = (e) => {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const x = (window.innerWidth / 2 - clientX) / 20;
            const y = (window.innerHeight / 2 - clientY) / 20;
            
            core.style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
            
            const px = (clientX - window.innerWidth / 2) / 30;
            const py = (clientY - window.innerHeight / 2) / 30;
            pupil.style.transform = `translate(${px}px, ${py}px)`;
        };

        document.addEventListener('mousemove', moveEvent);
        document.addEventListener('touchmove', moveEvent);

        let isSpeaking = false;
let speechWaveform = 0; 
let speechPitchModifier = 1;
let animationFrameId;

const synth = window.speechSynthesis;
let femaleVoice = null;

function loadVoices() {
    const voices = synth.getVoices();
    femaleVoice = voices.find(voice => 
        voice.name.toLowerCase().includes('female') || 
        voice.name.toLowerCase().includes('zira') || 
        voice.name.toLowerCase().includes('samantha') ||
        voice.name.toLowerCase().includes('google uk english female')
    );
    if (!femaleVoice && voices.length > 0) {
        femaleVoice = voices[0]; 
    }
}

loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
}

        function speak(text) {
    if (synth.speaking) {
        synth.cancel();
    }

    const utterance = new SpeechSynthesisUtterance(text);
    if (femaleVoice) {
        utterance.voice = femaleVoice;
    }
    
    utterance.pitch = 1.2; 
    utterance.rate = 0.95;  

    utterance.onstart = () => {
        isSpeaking = true;
    };

    utterance.onend = () => {
        isSpeaking = false;
    };

    utterance.onerror = () => {
        isSpeaking = false;
    };

    synth.speak(utterance);
                       }

        function updateVisuals() {
    animationFrameId = requestAnimationFrame(updateVisuals);

    if (isSpeaking) {
        speechWaveform = Math.sin(Date.now() * 0.015) * 0.4 + 0.6;
        speechWaveform += (Math.random() - 0.5) * 0.3; 
        speechPitchModifier = 1 + (Math.sin(Date.now() * 0.03) * 0.2);
    } else {
        speechWaveform = speechWaveform * 0.8; 
        if (speechWaveform < 0.01) speechWaveform = 0;
        speechPitchModifier = 1;
    }

    ringsArray.forEach((ringObj, index) => {
        const currentWave = speechWaveform * (1 + index * 0.15);
        const currentPitch = speechPitchModifier;
        
        const scale = 1 + (currentWave * 0.12);
        
        const waveA = 50 + (Math.sin((Date.now() * 0.01) + index) * (currentWave * 25) * currentPitch);
        const waveB = 50 + (Math.cos((Date.now() * 0.01) + index) * (currentWave * 25) * currentPitch);
        const waveC = 50 + (Math.sin((Date.now() * 0.015) - index) * (currentWave * 20));
        const waveD = 50 + (Math.cos((Date.now() * 0.005) + index) * (currentWave * 20));

        ringObj.element.style.transform = `${ringObj.baseTransform} scale(${scale})`;
        ringObj.element.style.borderRadius = `${waveA}% ${waveB}% ${waveC}% ${waveD}%`;
        
        if (isSpeaking) {
            ringObj.element.style.borderColor = `rgba(0, 242, 255, ${0.3 + (currentWave * 0.5)})`;
            ringObj.element.style.boxShadow = `0 0 ${currentWave * 15}px rgba(0, 242, 255, ${currentWave * 0.4})`;
        } else {
            ringObj.element.style.borderColor = 'rgba(0, 217, 255, 0.3)';
            ringObj.element.style.boxShadow = 'none';
        }
    });
}

updateVisuals();
        
    </script>
</body>
</html>
