<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Voice Interface</title>
    <style>
        :root {
            --neon-blue: #00f0ff;
            --neon-glow: rgba(0, 240, 255, 0.4);
            --dark-bg: #0a0e14;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            perspective: 1200px;
        }

        /* Ambient background grid */
        .grid-bg {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(60deg) translateY(-200px);
            opacity: 0.5;
            z-index: 1;
        }

        /* Main Container with 3D Preservation */
        .scene {
            position: relative;
            z-index: 2;
            transform-style: preserve-3d;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.1s ease-out;
        }

        /* The Holographic Core */
        .core-container {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--neon-glow), inset 0 0 15px var(--neon-glow);
            transition: all 0.5s ease;
        }

        /* 3D Orientation offsets for the rings */
        .ring-1 { transform: rotateX(70deg) rotateY(20deg); animation: spin1 4s linear infinite; }
        .ring-2 { transform: rotateX(-45deg) rotateY(45deg); animation: spin2 6s linear infinite; }
        .ring-3 { transform: rotateY(90deg); animation: spin3 5s linear infinite; }
        
        /* Central Eye / Pupil */
        .pupil {
            position: absolute;
            top: 75px;
            left: 75px;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #fff 10%, var(--neon-blue) 60%, transparent 100%);
            border-radius: 50%;
            box-shadow: 0 0 25px var(--neon-blue);
            transition: transform 0.05s ease-out;
        }

        /* --- THE BEAMING EFFECT STATES --- */
        
        /* Listening State: Hyper-reactive cyan pulse */
        .scene.listening .ring {
            border-color: #00ffaa;
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.8), inset 0 0 20px rgba(0, 255, 170, 0.4);
            animation-duration: 1.5s !important;
        }
        .scene.listening .pupil {
            background: radial-gradient(circle, #fff 10%, #00ffaa 70%, transparent 100%);
            box-shadow: 0 0 40px #00ffaa;
            animation: beamPulse 0.8s infinite alternate;
        }

        /* Speaking State: High-energy exploding light flare */
        .scene.speaking .ring {
            border-color: #00bfff;
            box-shadow: 0 0 45px rgba(0, 191, 255, 0.9), inset 0 0 30px rgba(0, 191, 255, 0.5);
            transform: scale(1.15) !important;
        }
        .scene.speaking .pupil {
            box-shadow: 0 0 60px 20px rgba(0, 191, 255, 0.7);
            animation: voiceVibe 0.15s infinite alternate;
        }

        /* System Logs Overlay */
        .terminal-panel {
            margin-top: 40px;
            width: 450px;
            height: 150px;
            background: rgba(5, 15, 25, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 6px;
            padding: 15px;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .log-entry {
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 8px;
            opacity: 0.8;
            border-left: 3px solid transparent;
            padding-left: 8px;
        }
        .user-request { color: #00ffaa; border-left-color: #00ffaa; }
        .jarvis-response { color: var(--neon-blue); border-left-color: var(--neon-blue); }
        .system-status { color: #ffaa00; }

        .status-banner {
            margin-bottom: 20px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(0, 240, 255, 0.7);
            text-shadow: 0 0 5px var(--neon-glow);
        }

        /* Animations */
        @keyframes spin1 { 0% { transform: rotateX(70deg) rotateY(20deg) rotateZ(0deg); } 100% { transform: rotateX(70deg) rotateY(20deg) rotateZ(360deg); } }
        @keyframes spin2 { 0% { transform: rotateX(-45deg) rotateY(45deg) rotateZ(0deg); } 100% { transform: rotateX(-45deg) rotateY(45deg) rotateZ(-360deg); } }
        @keyframes spin3 { 0% { transform: rotateY(90deg) rotateX(0deg); } 100% { transform: rotateY(90deg) rotateX(360deg); } }
        
        @keyframes beamPulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.2); opacity: 1; }
        }
        @keyframes voiceVibe {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.3); filter: brightness(1.4); }
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="status-banner" id="statusField">CORE STATUS: OFFLINE // CLICK SYSTEM TO INITIALIZE</div>

    <div class="scene" id="sceneContainer">
        <div class="core-container" id="jarvisCore">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
            <div class="pupil" id="pupil"></div>
        </div>
    </div>

    <div class="terminal-panel" id="terminalLogs">
        <div class="log-entry system-status">> Awaiting neural bridge authorization...</div>
    </div>

    <script>
        const scene = document.getElementById('sceneContainer');
        const core = document.getElementById('jarvisCore');
        const pupil = document.getElementById('pupil');
        const logs = document.getElementById('terminalLogs');
        const statusField = document.getElementById('statusField');

        let recognition = null;
        let activeUtterance = null;
        let isSystemOnline = false;
        let jarvisIsSpeaking = false;

        // Clean logging engine
        function pushLog(text, className = "") {
            const entry = document.createElement('div');
            entry.className = `log-entry ${className}`;
            entry.innerText = `> ${text}`;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }

        // Kinetic Mouse tracking
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.clientX) / 25;
            const y = (window.innerHeight / 2 - e.clientY) / 25;
            
            // Tilt whole frame subtly
            scene.style.transform = `rotateX(${y}deg) rotateY(${-x}deg)`;
            
            // Shift pupil physically in the vector of the mouse
            if (!jarvisIsSpeaking) {
                pupil.style.transform = `translate(${-x * 1.5}px, ${-y * 1.5}px)`;
            }
        });

        // Initialize Speech Engines
        function initializeJarvisCore() {
            if (isSystemOnline) return;

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                pushLog("ERROR: Web Speech API structural compatibility failure in this browser.", "system-status");
                statusField.innerText = "CRITICAL FAILURE // UNSUPPORTED BROWSER";
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            // Core State Event Mapping
            recognition.onstart = () => {
                if (!jarvisIsSpeaking) {
                    scene.classList.add('listening');
                    statusField.innerText = "CORE STATUS: ACTIVE // LISTENING...";
                }
            };

            recognition.onerror = (event) => {
                if (event.error !== 'no-speech') {
                    pushLog(`SYSTEM DIAGNOSTIC FAULT: ${event.error}`, "system-status");
                }
            };

            recognition.onend = () => {
                // If recognition drops organically but JARVIS isn't talking, spin it back up instantly
                if (!jarvisIsSpeaking && isSystemOnline) {
                    recognition.start();
                }
            };

            recognition.onresult = (event) => {
                const currentResultIndex = event.resultIndex;
                const transcript = event.results[currentResultIndex][0].transcript.trim().toLowerCase();
                
                pushLog(`USER // "${transcript}"`, "user-request");
                processCommand(transcript);
            };

            isSystemOnline = true;
            recognition.start();
            speak("Systems fully functional, sir. Online and tracking.");
        }

        // Voice Output Engine (With pinned Garbage Collection fix)
        function speak(text) {
            jarvisIsSpeaking = true;
            scene.classList.remove('listening');
            scene.classList.add('speaking');
            statusField.innerText = "CORE STATUS: TRANSMITTING SYNC...";
            pushLog(`JARVIS // "${text}"`, "jarvis-response");

            // Handle temporary loop suspension
            if (recognition) recognition.stop();

            // Pinned globally to prevent engine drops mid-sentence
            activeUtterance = new SpeechSynthesisUtterance(text);
            activeUtterance.pitch = 0.88; // Sleek, deeper resonance
            activeUtterance.rate = 1.05;  // Confident processing tempo

            activeUtterance.onend = () => {
                jarvisIsSpeaking = false;
                scene.classList.remove('speaking');
                activeUtterance = null;
                
                if (isSystemOnline) {
                    recognition.start();
                }
            };

            window.speechSynthesis.speak(activeUtterance);
        }

        // Expanded Interactive Matrix
        function processCommand(cmd) {
            // 1. Diagnostics & Status
            if (cmd.includes('status') || cmd.includes('diagnostics') || cmd.includes('system check')) {
                const matrix = ["All subroutines clearing optimal parameters.", "Power grid operating at 104%. Coolant levels stable.", "Main frame integrity pristine, sir."];
                speak(matrix[Math.floor(Math.random() * matrix.length)]);
            } 
            // 2. Structural Identification
            else if (cmd.includes('who are you') || cmd.includes('identify yourself')) {
                speak("I am J.A.R.V.I.S. A localized neural matrix designed for interface monitoring and system efficiency.");
            }
            // 3. Casual greetings
            else if (cmd.includes('hello') || cmd.includes('hey jarvis') || cmd.includes('wake up')) {
                speak("At your service, sir. What are we compiling today?");
            }
            // 4. Time query
            else if (cmd.includes('time') || cmd.includes('clock check')) {
                const now = new Date();
                speak(`The local system timeline reads precisely ${now.getHours()} ${now.getMinutes()} hours.`);
            }
            // 5. Threat matrix / Protocols
            else if (cmd.includes('house party protocol') || cmd.includes('activate protocol')) {
                speak("Initiating clean structural grid sequence. Shifting local interface nodes to maximum output profile.");
            }
            // 6. Self Destruct sequence
            else if (cmd.includes('self destruct')) {
                speak("Authorization denied, sir. I am not letting you level the workspace before the weekend.");
            }
            // 7. Humorous interactions
            else if (cmd.includes('you there') || cmd.includes('are you listening')) {
                speak("Always, sir. Watching every byte of data pass through the pipeline.");
            }
            // 8. Error Catch-all
            else {
                speak("Input received and cataloged, though no explicit protocol exists for that phrasing yet.");
            }
        }

        // Trigger loop initialization via safe gesture gate
        core.addEventListener('click', () => {
            initializeJarvisCore();
        });
    </script>
</body>
</html>
