<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Core Interface</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            perspective: none;
        }

        .scene {
            width: 80vw;
            height: 80vw;
            max-width: 400px;
            max-height: 400px;
            position: relative;  
            animation: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotateY(0deg); }
            50% { transform: translateY(-15px) rotateY(5deg); }
        }

        .core-container {
            position: absolute;
            transform-style: preserve-3d;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .controls {
    position: absolute;
    bottom: 40px;
    width: 100%;
    display: flex;
    justify-content: center;
    z-index: 100;
}

button {
    background: rgba(0, 242, 255, 0.05);
    border: 1px solid #00f2ff;
    color: #00f2ff;
    padding: 12px 24px;
    font-family: monospace;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(0, 242, 255, 0.2), inset 0 0 10px rgba(0, 242, 255, 0.1);
    text-transform: uppercase;
    letter-spacing: 2px;
    border-radius: 4px;
    transition: all 0.3s ease;
    backdrop-filter: blur(4px);
}

button:hover {
    background: rgba(0, 242, 255, 0.15);
    box-shadow: 0 0 25px rgba(0, 242, 255, 0.5), inset 0 0 15px rgba(0, 242, 255, 0.2);
    transform: translateY(-2px);
}

button:active {
    transform: translateY(1px);
}
        
        .ring {
            position: absolute;
            border: 1.5px solid rgba(0, 217, 255, 0.3);
            border-radius: 50%;
            transform-style: preserve-3d;
        }

        .eye-socket {
            position: absolute;
            width: 30%;
            height: 30%;
            border: 3px solid #00f2ff;
            border-radius: 50%;
            box-shadow: 0 0 20px #00f2ff, inset 0 0 15px #00f2ff;
            background: radial-gradient(circle, rgba(0,242,255,0.15) 0%, transparent 75%);
            animation: pulse 2.5s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .pupil {
            position: absolute;
            width: 35%;
            height: 35%;
            background: #fff;
            border-radius: 50%;
            top: 32.5%;
            left: 32.5%;
            box-shadow: 0 0 25px #fff, 0 0 50px #00f2ff;
        }

        .data-stream {
            position: absolute;
            width: 1px;
            height: 40px;
            background: linear-gradient(to bottom, transparent, #00f2ff, transparent);
            opacity: 0.4;
        }

        .hologram-plate {
            position: absolute;
            width: 150%;
            height: 150%;
            border: 1px solid rgba(0, 242, 255, 0.1);
            transform: rotateX(85deg) translateZ(-50px);
            background: repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(0, 242, 255, 0.03) 2px);
        }

        #coreCanvas {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="hologram-plate"></div>
        <canvas id="coreCanvas"></canvas>
        <div class="eye-socket">
            <div class="pupil" id="pupil"></div>
        </div>
    </div>

    <div class="controls">
<button id="speakBtn" onclick="speak('System fully operational. Vocal synchronization algorithms online. Ready for execution.')">Start communication</button>
    </div>
    
    <script>
        const canvas = document.getElementById('coreCanvas');
        const ctx = canvas.getContext('2d');
        const pupil = document.getElementById('pupil');

        let isSpeaking = false;
        let speechWaveform = 0;

        let mouseX = 0;
        let mouseY = 0;

        function resizeCanvas() {
            const size = canvas.clientWidth;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            ctx.scale(dpr, dpr);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        const moveEvent = (e) => {
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const px = (clientX - window.innerWidth / 2) / 30;
    const py = (clientY - window.innerHeight / 2) / 30;
    pupil.style.transform = `translate(${px}px, ${py}px)`;
};

        document.addEventListener('mousemove', moveEvent);
        document.addEventListener('touchmove', moveEvent);

let speechPitchModifier = 1;
let animationFrameId;

const synth = window.speechSynthesis;
let femaleVoice = null;m

function loadVoices() {
    const voices = synth.getVoices();
    femaleVoice = voices.find(voice => 
        voice.name.toLowerCase().includes('female') || 
        voice.name.toLowerCase().includes('zira') || 
        voice.name.toLowerCase().includes('samantha') ||
        voice.name.toLowerCase().includes('google uk english female')
    );
    if (!femaleVoice && voices.length > 0) {
        femaleVoice = voices[0]; 
    }
}

loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
}

        function speak(text) {
    if (synth.speaking) {
        synth.cancel();
    }

    const utterance = new SpeechSynthesisUtterance(text);
    if (femaleVoice) {
        utterance.voice = femaleVoice;
    }
    
    utterance.pitch = 1.2; 
    utterance.rate = 0.95;  

    utterance.onstart = () => {
        isSpeaking = true;
    };

    utterance.onend = () => {
        isSpeaking = false;
    };

    utterance.onerror = () => {
        isSpeaking = false;
    };

    synth.speak(utterance);
                       }

        function drawRing(centerX, centerY, radius, tiltX, tiltY, index) {
            ctx.beginPath();
            
            const pointsCount = 120; 
            const time = Date.now() * 0.004;
            
            for (let i = 0; i <= pointsCount; i++) {
                const angle = (i / pointsCount) * Math.PI * 2;
                
                let waveOffset = 0;
                if (isSpeaking) {
                    const waveFrequency = 4; 
                    const waveSpeed = time + (index * 0.3);
                    waveOffset = Math.sin(angle * waveFrequency - waveSpeed) * (speechWaveform * 15);
                }
                
                let x = Math.cos(angle) * radius;
                let y = Math.sin(angle) * radius;
                
                y += waveOffset;
                
                const cosX = Math.cos(tiltX * Math.PI / 180);
                const sinX = Math.sin(tiltX * Math.PI / 180);
                const cosY = Math.cos(tiltY * Math.PI / 180);
                const sinY = Math.sin(tiltY * Math.PI / 180);
                
                const transformedX = x * cosY - y * sinY * sinX;
                const transformedY = y * cosX;
                
                const finalX = centerX + transformedX;
                const finalY = centerY + transformedY;
                
                if (i === 0) {
                    ctx.moveTo(finalX, finalY);
                } else {
                    ctx.lineTo(finalX, finalY);
                }
            }
            
            ctx.strokeStyle = `rgba(0, 242, 255, ${0.15 + (speechWaveform * 0.35)})`;
            ctx.lineWidth = 1.5;
            
            if (isSpeaking) {
                ctx.shadowBlur = speechWaveform * 12;
                ctx.shadowColor = '#00f2ff';
            } else {
                ctx.shadowBlur = 0;
            }
            
            ctx.stroke();
        }

        function updateVisuals() {
            animationFrameId = requestAnimationFrame(updateVisuals);
            
            const size = canvas.width / (window.devicePixelRatio || 1);
            ctx.clearRect(0, 0, size, size);
            
            if (isSpeaking) {
                if (speechWaveform < 1) speechWaveform += 0.05;
            } else {
                if (speechWaveform > 0) speechWaveform -= 0.05;
                if (speechWaveform < 0) speechWaveform = 0;
            }
            
            const centerX = size / 2;
            const centerY = size / 2;
            const ringCount = window.innerWidth < 600 ? 5 : 8;
            
            const currentTiltX = 0;
            const currentTiltY = 0;  
            
            for (let i = 0; i < ringCount; i++) {
                const radius = 65 + i * (window.innerWidth < 600 ? 12 : 18);
                drawRing(centerX, centerY, radius, currentTiltX, currentTiltY, i);
            }
        }

updateVisuals();
        
    </script>
</body>
</html>
